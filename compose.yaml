version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beacon-engine-backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/beacon.db
      - DEMO_MODE=true
      - BUILD_WORKSPACE=./data/builds
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/healthz', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - beacon-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beacon-engine-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - beacon-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: beacon-engine-keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - beacon-network
    profiles:
      - with-auth

volumes:
  backend_data:
  keycloak_data:

networks:
  beacon-network:
    driver: bridge