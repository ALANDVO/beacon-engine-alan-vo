[project]
name = "beacon-engine"
version = "1.0.0"
description = "Windows image builder with ISO analysis and build orchestration"
authors = [{name = "Alan Vo", email = "alanvo@gmail.com"}]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.3",
    "faker==33.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
